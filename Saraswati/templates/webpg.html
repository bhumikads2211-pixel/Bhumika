<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Subcom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }
    .content {
      display: flex;
      width: 100%;
    }
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
    }
    .sidebar h2 {
      margin-bottom: 40px;
      font-size: 28px;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    .sidebar ul {
      list-style: none;
    }
    .sidebar ul.menu li,
    .sidebar ul.account li {
      padding: 15px 20px;
      cursor: pointer;
      font-size: 17px;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }
    .sidebar ul.menu li:hover,
    .sidebar ul.account li:hover {
      background-color: rgba(255, 255, 255, 0.15);
      padding-left: 28px;
      transform: translateX(5px);
    }
    .sidebar ul.menu li.active {
      background-color: rgba(255, 255, 255, 0.2);
      font-weight: bold;
    }
    .sidebar a {
      text-decoration: none;
      color: white;
    }
    .sidebar hr {
      margin: 25px 0;
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }
    .login, .logout {
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      color: white;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .login {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(240, 147, 251, 0.4);
    }
    .logout {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    }
    .logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
    }
    .main-content {
      flex: 1;
      padding: 50px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.05);
    }
    .main-content h1 {
      margin-bottom: 40px;
      font-size: 36px;
      color: white;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
    }
    .boxes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
    }
    .box {
      background: white;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    }
    .box:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    .box-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    .box.attendance {
      color: #667eea;
    }
    .box.timetable {
      color: #f093fb;
    }
    .box.results {
      color: #4facfe;
    }
    .box.review {
      color: #43e97b;
    }
    .box.attendance::before {
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    }
    .box.timetable::before {
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
    }
    .box.results::before {
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
    }
    .box.review::before {
      background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
        padding: 20px 15px;
      }
      .main-content {
        padding: 30px 20px;
      }
      .main-content h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <!-- Sidebar -->
    <div class="sidebar">
      <div>
        <h2>SUBCOM</h2>
        <ul class="menu">
          <li class="active">📊 Dashboard</li>
          <a href="courses"><li>📚 My Course</li></a>
          <a href="certificates"><li>🏆 Certificate</li></a>
          <li>❓ Questions</li>
        </ul>
        <hr/>
        <ul class="account">
          <li>⚙️ Settings</li>
          <li>💡 Help</li>
        </ul>
        <!-- Login & Logout Buttons -->
        <div class="btn-group">
          <a href="/login" class="login">Login</a>
          <button class="logout">Logout</button>
        </div>
      </div>
    </div>
    <!-- Main Content -->
    <div class="main-content">
      <h1>Welcome to Your Dashboard</h1>
      <div class="boxes">
        <div class="box attendance">
          <div class="box-icon">📅</div>
          <div>Attendance</div>
        </div>
        <div class="box timetable">
          <div class="box-icon">🕐</div>
          <div>Time Table</div>
        </div>
        <div class="box results">
          <div class="box-icon">📊</div>
          <div>Results</div>
        </div>
        <div class="box review">
          <div class="box-icon">⭐</div>
          <div>Review</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
